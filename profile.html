<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | SkillSync AI</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">
<i class="fa-solid fa-brain"></i>
SkillSync AI
</div>

<ul>
<li><a href="dashboard.html">Dashboard</a></li>
</ul>

</nav>

<section class="dashboard">

<h1>👤 My Profile</h1>

<div class="card">

<h2 id="name"></h2>

<p><strong>College:</strong> <span id="college"></span></p>

<p><strong>Branch:</strong> <span id="branch"></span></p>

<p><strong>Skills I Can Teach:</strong> <span id="teach"></span></p>

<p><strong>Skills I Want to Learn:</strong> <span id="learn"></span></p>

<br>

<button class="login-btn" onclick="window.location.href='dashboard.html'">
⬅ Back to Dashboard
</button>

</div>

</section>
<script>

let user = JSON.parse(localStorage.getItem("loggedInUser"));

if (!user) {
    alert("Please login first!");
    window.location.href = "login.html";
}

document.getElementById("name").innerHTML = user.name;
document.getElementById("college").innerHTML = user.college;
document.getElementById("branch").innerHTML = user.branch;
document.getElementById("teach").innerHTML = user.teach;
document.getElementById("learn").innerHTML = user.learn;

</script>

</body>
</html>
