<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Skill Assessment</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<nav>

<div class="logo">
<i class="fa-solid fa-brain"></i>
SkillSync AI
</div>

<ul>
<li><a href="dashboard.html">Dashboard</a></li>
</ul>

</nav>

<section class="dashboard">

<h1>🤖 AI Skill Assessment</h1>

<div class="card">

<select id="skillSelect" required>
    <option value="">Select Your Skill</option>
    <option>Java</option>
    <option>Python</option>
    <option>C++</option>
    <option>HTML</option>
    <option>CSS</option>
    <option>JavaScript</option>
    <option>Artificial Intelligence</option>
    <option>Machine Learning</option>
    <option>Web Development</option>
</select>

<br><br>
<button class="login-btn" onclick="startAssessment()">
<i class="fa-solid fa-play"></i>
Start Assessment
</button>
</div>

</section>
<script>

function startAssessment(){

    let skill = document.getElementById("skillSelect").value;

    if(skill === ""){
        alert("Please select a skill first!");
        return;
    }

    localStorage.setItem("selectedSkill", skill);

    window.location.href = "quiz.html";

}

</script>

</body>
</html>
